name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # macOS — build DMG on macOS 14 runner
  # ─────────────────────────────────────────────
  macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG
        run: bash macos/scripts/make-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: macos/dist/*.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Windows — publish self-contained exe, then wrap with Inno Setup
  # ─────────────────────────────────────────────
  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        working-directory: windows
        run: dotnet restore

      - name: Publish self-contained app
        shell: pwsh
        run: ./windows/publish.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "windows\installer\MonitorSuhu.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: windows/dist/MonitorSuhu-*-windows-x64.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Linux — artifact-only; not a Release gate
  # ─────────────────────────────────────────────
  linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test hwmon fixtures
        run: dotnet test linux/MonitorSuhu.Linux.Tests/MonitorSuhu.Linux.Tests.csproj --nologo

      - name: Publish self-contained app
        run: dotnet publish linux/MonitorSuhu.Linux.csproj -c Release -r linux-x64 --self-contained true -o linux/dist/linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: linux/dist/linux-x64
          if-no-files-found: error


  # ─────────────────────────────────────────────
  # Release — only on v* tags; requires both builds to succeed
  # ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## MonitorSuhu ${{ github.ref_name }}

            Lightweight hardware temperature overlay for macOS and Windows.

            ---

            ### ⬇️ Downloads

            | Platform | File |
            |---|---|
            | **macOS** (Apple Silicon, macOS 14+) | `MonitorSuhu-*-macos.dmg` |
            | **Windows** (x64, Windows 10 / 11) | `MonitorSuhu-*-windows-x64.exe` |

            ---

            ### 🍎 macOS — First Launch

            macOS may block the app on first open (unsigned build). Run this once:

            ```bash
            xattr -cr /Applications/MonitorSuhu.app && open /Applications/MonitorSuhu.app
            ```

            Or right-click → **Open** → **Open**. Still blocked? **System Settings → Privacy & Security → Open Anyway**.

            ---

            ### 🪟 Windows — First Launch

            Run the installer as **Administrator** (UAC prompt appears). The installer registers a Task Scheduler task at highest privileges so the overlay retains sensor access after reboot.

            > **Antivirus alert?** LibreHardwareMonitor uses a kernel driver to read hardware sensors. Allow the driver if your antivirus flags it — the HUD will otherwise show no readings.

            ---

            ### ⌨️ Keyboard Shortcuts

            | Shortcut | Action |
            |---|---|
            | `⌃⇧T` / `Ctrl+Shift+T` | Show / hide overlay |
            | `⌃⇧E` / `Ctrl+Shift+E` | Unlock overlay for dragging |

            ---

            ### 🔄 Upgrading

            - **macOS:** drag the new app into Applications (replace the old one)
            - **Windows:** run the new installer — it replaces the previous version automatically

            ---

            > Full changelog auto-generated below ↓
          append_body: true
          files: |
            dist/*.dmg
            dist/*.exe
