name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # macOS — build DMG on macOS 14 runner
  # ─────────────────────────────────────────────
  macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Logic tests
        run: make -C macos test

      - name: Build DMG
        run: bash macos/scripts/make-dmg.sh

      - name: Universal binary
        run: |
          bin="macos/build/MonitorSuhu.app/Contents/MacOS/MonitorSuhu"
          archs="$(lipo -archs "$bin")"
          echo "archs=$archs"
          echo "$archs" | grep -qw x86_64
          echo "$archs" | grep -qw arm64

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: macos/dist/*.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Windows — publish self-contained exe, then wrap with Inno Setup
  # ─────────────────────────────────────────────
  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        working-directory: windows
        run: dotnet restore

      - name: Test Core and Sensors
        working-directory: windows
        run: |
          dotnet test src/MonitorSuhu.Core.Tests/MonitorSuhu.Core.Tests.csproj --nologo
          dotnet test src/MonitorSuhu.Sensors.Tests/MonitorSuhu.Sensors.Tests.csproj --nologo

      - name: Publish self-contained app
        shell: pwsh
        run: ./windows/publish.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "windows\installer\MonitorSuhu.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: windows/dist/MonitorSuhu-*-windows-x64.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Linux — artifact-only; not a Release gate
  # ─────────────────────────────────────────────
  linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test hwmon fixtures
        run: dotnet test linux/MonitorSuhu.Linux.Tests/MonitorSuhu.Linux.Tests.csproj --nologo

      - name: Publish self-contained app
        run: dotnet publish linux/MonitorSuhu.Linux.csproj -c Release -r linux-x64 --self-contained true -o linux/dist/linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: linux/dist/linux-x64
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Version — VERSION must match plist / csproj / iss
  # ─────────────────────────────────────────────
  version:
    name: Check VERSION
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare VERSION pins
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$VERSION"
          plist="$(python3 -c 'import plistlib; print(plistlib.load(open("macos/Resources/Info.plist","rb"))["CFBundleShortVersionString"])')"
          app="$(grep -oP '(?<=<Version>)[^<]+' windows/src/MonitorSuhu.App/MonitorSuhu.App.csproj | head -1)"
          linux="$(grep -oP '(?<=<Version>)[^<]+' linux/MonitorSuhu.Linux.csproj | head -1)"
          iss="$(grep -oP '(?<=#define MyAppVersion ")[^"]+' windows/installer/MonitorSuhu.iss)"
          echo "plist=$plist app=$app linux=$linux iss=$iss"
          test "$plist" = "$VERSION"
          test "$app" = "$VERSION"
          test "$linux" = "$VERSION"
          test "$iss" = "$VERSION"

  # ─────────────────────────────────────────────
  # Release — only on v* tags; requires both builds to succeed
  # ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## MonitorSuhu ${{ github.ref_name }}

            Lightweight hardware temperature overlay for macOS and Windows. Install newer releases from Settings.

            ---

            ### ⬇️ Downloads

            | Platform | File |
            |---|---|
            | **macOS** (Apple Silicon, macOS 14+) | `MonitorSuhu-*-macos.dmg` |
            | **Windows** (x64, Windows 10 / 11) | `MonitorSuhu-*-windows-x64.exe` |

            ---

            ### 🍎 macOS — First Launch

            macOS may block the app on first open (unsigned build). Run this once:

            ```bash
            xattr -cr /Applications/MonitorSuhu.app && open /Applications/MonitorSuhu.app
            ```

            Or right-click → **Open** → **Open**. Still blocked? **System Settings → Privacy & Security → Open Anyway**.

            ---

            ### 🪟 Windows — First Launch

            Run the installer as **Administrator** (UAC prompt appears). The installer registers a Task Scheduler task at highest privileges so the overlay retains sensor access after reboot.

            > **Antivirus alert?** LibreHardwareMonitor uses a kernel driver to read hardware sensors. Allow the driver if your antivirus flags it — the HUD will otherwise show no readings.

            ---

            ### ⌨️ Keyboard Shortcuts

            | Shortcut | Action |
            |---|---|
            | `⌃⇧T` / `Ctrl+Shift+T` | Show / hide overlay |
            | `⌃⇧E` / `Ctrl+Shift+E` | Unlock overlay for dragging |

            ---

            ### 🔄 Upgrading

            From Settings (or the tray / menu bar) choose **Install …** — the app downloads this release and replaces itself.

            - **macOS:** installs the DMG over the current `.app`; settings stay in Application Support
            - **Windows:** runs this setup silently and relaunches; settings stay in `%AppData%`
            - Manual fallback: drag the new app into Applications, or run the `.exe` installer

            ---

            > Full changelog auto-generated below ↓
          append_body: true
          files: |
            dist/*.dmg
            dist/*.exe
